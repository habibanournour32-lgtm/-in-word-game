<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>-in Word Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: chunky sticker picture cards in a wrapping row, with a tray of word tiles below.
   Each tile has a dashed home spot in the tray so a wrong drop snaps back to where it started. */
:root {
  --bg: #BFE5FF;
  --bg2: #E6F6FF;
  --card: #FFFFFF;
  --ink: #26244A;
  --muted: #4F5784;
  --line: #A9C0DE;
  --edge: #26244A;
  --stage: #FFF3C4;
  --outline: #26244A;
  --accent: #E5483D;
  --good: #17996A;
  --good-bg: #D9F6E8;
  --warn-bg: #FFE6BF;
  --tile: #FFFFFF;
  --slot: rgba(255, 255, 255, 0.6);
  --star: #FFC21A;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-word: "Andika", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --g: 16px;
  --n: 5;
  --th: 92px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121B3D;
    --bg2: #1B2858;
    --card: #243366;
    --ink: #F3F1FF;
    --muted: #B9C2F0;
    --line: #4A5C99;
    --edge: #0A1030;
    --accent: #FF7A6B;
    --good: #4BE0A4;
    --good-bg: #1C5A4D;
    --warn-bg: #5A4620;
    --tile: #2F4180;
    --slot: rgba(255, 255, 255, 0.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121B3D;
  --bg2: #1B2858;
  --card: #243366;
  --ink: #F3F1FF;
  --muted: #B9C2F0;
  --line: #4A5C99;
  --edge: #0A1030;
  --accent: #FF7A6B;
  --good: #4BE0A4;
  --good-bg: #1C5A4D;
  --warn-bg: #5A4620;
  --tile: #2F4180;
  --slot: rgba(255, 255, 255, 0.07);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  background-image: linear-gradient(180deg, var(--bg2), var(--bg));
  color: var(--ink);
  font-family: var(--font-word);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 48px;
  min-height: 100%;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.top > div { min-width: 0; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.1rem, 6.4vw, 3.9rem);
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}
.fam { color: var(--accent); position: relative; white-space: nowrap; }
.fam::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -0.06em; height: 0.13em;
  border-radius: 99px; background: var(--accent); opacity: 0.35;
}
.sub { margin: 0.5rem 0 0; font-size: clamp(1.05rem, 2.6vw, 1.3rem); font-weight: 700; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stars { display: flex; gap: 4px; }
.star { width: 34px; height: 34px; fill: var(--line); stroke: var(--edge); stroke-width: 2.5; stroke-linejoin: round; transition: fill 0.2s; }
.star.on { fill: var(--star); animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
.btn {
  font: inherit; font-weight: 700; font-size: 1rem; color: var(--ink); background: var(--card);
  border: 3px solid var(--edge); border-radius: 999px; padding: 0.45rem 1rem; box-shadow: 0 4px 0 var(--edge);
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

/* message */
#msg {
  align-self: center; margin: 0; text-align: center; font-weight: 700; font-size: clamp(1.1rem, 2.8vw, 1.4rem);
  background: var(--card); border: 3px solid var(--edge); border-radius: 999px; padding: 0.55rem 1.3rem;
  box-shadow: 0 4px 0 var(--edge); transition: background 0.2s;
}
#msg.good { background: var(--good-bg); }
#msg.warn { background: var(--warn-bg); }

/* picture cards */
.cards, .tray { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--g); --cw: calc((100% - (var(--n) - 1) * var(--g)) / var(--n)); }
.card {
  position: relative; flex: 0 0 var(--cw); min-width: 0; padding: 12px; background: var(--card);
  border: 3px solid var(--edge); border-radius: 26px; box-shadow: 0 6px 0 var(--edge);
  display: flex; flex-direction: column; gap: 12px;
  transition: transform 0.15s, background 0.2s;
}
.card.hover { transform: translateY(-4px) scale(1.03); background: var(--good-bg); }
.card.done { background: var(--good-bg); }
.card.shake { animation: shake 0.45s; }
.stage { background: var(--stage); border-radius: 18px; padding: 10px; display: grid; place-items: center; }
.stage svg { width: 100%; max-width: 128px; height: auto; display: block; }
.o { stroke: var(--outline); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.slot {
  width: 100%; height: var(--th); border: 3px dashed var(--line); border-radius: 20px; background: var(--slot);
  display: grid; place-items: center; color: var(--line); font-family: var(--font-display); font-weight: 800; font-size: 2rem;
}
.slot:empty::before { content: "?"; }
.card.done .slot { border-style: solid; border-color: var(--good); }
.badge {
  position: absolute; top: -14px; right: -12px; width: 40px; height: 40px; border-radius: 50%; background: var(--good);
  border: 3px solid var(--edge); display: grid; place-items: center; transform: scale(0); transition: transform 0.4s cubic-bezier(.3, 1.8, .5, 1);
}
.badge svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.card.done .badge { transform: scale(1); }

/* words */
.tray-label { margin: 0; text-align: center; font-weight: 700; color: var(--muted); font-size: 1.05rem; }
.spot {
  flex: 0 0 calc(var(--cw) - 30px); height: var(--th); border: 3px dashed var(--line); border-radius: 20px; background: var(--slot);
}
.tile {
  position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  background: var(--tile); border: 3px solid var(--edge); border-radius: 20px; box-shadow: 0 5px 0 var(--edge);
  font-family: var(--font-word); font-weight: 700; font-size: clamp(2.1rem, 5.4vw, 3.4rem); letter-spacing: 0.02em; line-height: 1;
  cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
  transition: transform 0.35s cubic-bezier(.3, 1.5, .5, 1);
}
.tile .rime { color: var(--accent); }
.tile.sel { outline: 4px solid var(--accent); outline-offset: 3px; }
.tile.drag { z-index: 100; cursor: grabbing; box-shadow: 0 14px 0 var(--edge), 0 24px 30px rgba(0, 0, 0, 0.25); }
.tile.placed { cursor: default; pointer-events: none; background: var(--good-bg); border-color: var(--good); box-shadow: none; }
.tile.placed .rime { color: var(--good); }

/* end panel */
.end { align-self: center; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.end p { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 4.6vw, 2.4rem); }
.end .btn { font-size: 1.3rem; padding: 0.6rem 1.6rem; background: var(--accent); color: #fff; }

/* effects */
.spark {
  position: absolute; width: 22px; height: 22px; background: var(--star); pointer-events: none; z-index: 60;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  animation: burst 0.8s ease-out forwards;
}
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 200; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
@keyframes burst { from { transform: translate(0, 0) scale(0.4) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(180deg); opacity: 0; } }
@keyframes fall { to { transform: translate(var(--sx), 110vh) rotate(var(--rot)); } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(0.3); } 100% { transform: scale(1); } }

@media (max-width: 1023px) { :root { --n: 3; } }
@media (max-width: 599px) {
  :root { --n: 2; --g: 12px; --th: 72px; }
  .card { padding: 10px; border-radius: 22px; }
  .tools { width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .confetti { display: none; }
}
</style>

<main class="wrap">
  <header class="top">
    <div>
      <h1>Let's Play with <span class="fam">-in</span> Words!</h1>
      <p class="sub">Drag each word to the picture it names.</p>
    </div>
    <div class="tools">
      <div class="stars" id="stars" role="img" aria-label="Stars earned">
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>

      <button class="btn" id="sound" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        <span id="soundLabel">Sound on</span>
      </button>
      <button class="btn" id="restart" type="button">Shuffle</button>

  </header>

  <p id="msg" role="status" aria-live="polite">Pick a word and drop it on its picture!</p>

  <section class="cards" id="cards" aria-label="Pictures">
    <article class="card" data-word="bin" tabindex="0" role="button" aria-label="Picture: trash bin">
      <div class="stage">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path class="o" d="M70 30 L80 12 L94 20 L86 33Z" fill="#FFFFFF"/>

          <path class="o" d="M48 54 V98 M60 54 V98 M72 54 V98" fill="none"/>

<script>
(function () {
  var WORDS = ['bin', 'fin', 'pin', 'tin', 'win'];
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var tray = document.getElementById('tray');
  var msg = document.getElementById('msg');
  var stars = Array.prototype.slice.call(document.querySelectorAll('.star'));
  var endBox = document.getElementById('end');
  var soundBtn = document.getElementById('sound');
  var soundLabel = document.getElementById('soundLabel');
  var done = 0, selected = null, muted = false, ac = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- sound ---------- */
  function ctx() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(f, t0, d, type, vol) {
    var a = ctx(); if (!a || muted) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.05);
  }
  function chime() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * 0.09, 0.5, 'triangle', 0.13); }); }
  function oops() { tone(300, 0, 0.18, 'sine', 0.08); tone(235, 0.14, 0.28, 'sine', 0.08); }
  function cheer() {
    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone(f, i * 0.12, 0.5, 'triangle', 0.13); });
    [1568, 1760, 2093, 1760, 2093, 2349].forEach(function (f, i) { tone(f, 0.9 + i * 0.07, 0.35, 'sine', 0.05); });
  }
  function say(text, rate) {
    if (muted || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = rate || 0.8; u.pitch = 1.15;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  soundBtn.addEventListener('click', function () {
    muted = !muted;
    soundBtn.setAttribute('aria-pressed', String(!muted));
    soundLabel.textContent = muted ? 'Sound off' : 'Sound on';
    document.getElementById('wave').style.display = muted ? 'none' : '';
    if (muted && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
  });
  document.addEventListener('pointerdown', ctx, { once: true });

  /* ---------- helpers ---------- */
  function setMsg(text, tone) { msg.textContent = text; msg.className = tone || ''; }
  function shuffle(a) {
    var b = a.slice(), i, j, t;
    for (i = b.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }
  function cardAt(x, y) {
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cards[i];
    }
    return null;
  }
  function hover(card) { cards.forEach(function (c) { c.classList.toggle('hover', c === card && !c.classList.contains('done')); }); }
  function select(t) {
    if (selected) selected.classList.remove('sel');
    selected = t;
    if (t) t.classList.add('sel');
  }

  /* ---------- game ---------- */
  function build() {
    tray.innerHTML = '';
    cards.forEach(function (c) { c.classList.remove('done', 'hover', 'shake'); c.querySelector('.slot').innerHTML = ''; });
    stars.forEach(function (s) { s.classList.remove('on'); });
    done = 0; selected = null; endBox.hidden = true;
    setMsg('Pick a word and drop it on its picture!');
    var order = shuffle(WORDS);
    if (order.join() === WORDS.join()) order = order.slice(1).concat(order[0]);
    order.forEach(function (w) {
      var spot = document.createElement('div'); spot.className = 'spot';
      var t = document.createElement('div');
      t.className = 'tile'; t.dataset.word = w; t.tabIndex = 0; t.setAttribute('role', 'button');
      t.setAttribute('aria-label', 'Word ' + w + '. Drag it to its picture, or press Enter and then choose a picture.');
      t.innerHTML = '<span>' + w.charAt(0) + '</span><span class="rime">in</span>';
      spot.appendChild(t); tray.appendChild(spot); attach(t);
    });
  }

  function snapBack(t) {
    t.style.transition = 'transform 0.45s cubic-bezier(.3, 1.6, .5, 1)';
    t.style.transform = 'none';
    setTimeout(function () { t.classList.remove('drag'); t.style.transition = ''; }, 480);
  }

  function burst(card) {
    if (reduce) return;
    var r = card.querySelector('.slot').getBoundingClientRect(), cr = card.getBoundingClientRect();
    for (var i = 0; i < 9; i++) {
      var s = document.createElement('i'); s.className = 'spark';
      var a = (i / 9) * Math.PI * 2, d = 70 + Math.random() * 40;
      s.style.left = (r.left - cr.left + r.width / 2 - 11) + 'px';
      s.style.top = (r.top - cr.top + r.height / 2 - 11) + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      card.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 900); })(s);
    }
  }

  function place(t, card) {
    var slot = card.querySelector('.slot');
    var first = t.getBoundingClientRect();
    t.style.transition = 'none'; t.style.transform = 'none';
    t.classList.remove('drag', 'sel'); t.classList.add('placed');
    slot.appendChild(t);
    var last = t.getBoundingClientRect();
    t.style.transform = 'translate(' + (first.left - last.left) + 'px,' + (first.top - last.top) + 'px)';
    void t.offsetWidth;
    t.style.transition = 'transform 0.35s cubic-bezier(.3, 1.4, .5, 1)';
    t.style.transform = 'none';
    card.classList.add('done');
    burst(card);
    chime();
    done++;
    stars[done - 1].classList.add('on');
    var w = t.dataset.word;
    if (done === WORDS.length) {
      setMsg('Yes! ' + w + '! All five words matched!', 'good');
      setTimeout(finish, 650);
    } else {
      setMsg('Yes! ' + w + '! Great job!', 'good');
      setTimeout(function () { say(w); }, 350);
    }
  }

  function wrong(card) {
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    setTimeout(function () { card.classList.remove('shake'); }, 480);
    oops();
    setMsg('Not quite. Try another picture!', 'warn');
  }

  function attempt(t, card) {
    var ok = card.dataset.word === t.dataset.word && !card.classList.contains('done');
    select(null);
    if (ok) place(t, card); else { snapBack(t); if (!card.classList.contains('done')) wrong(card); }
  }

  function finish() {
    endBox.hidden = false;
    cheer();
    setTimeout(function () { say('You did it! Great reading!', 0.9); }, 700);
    if (!reduce) {
      var box = document.createElement('div'); box.className = 'confetti';
      var cols = ['#FF5C5C', '#FFC21A', '#3CC48A', '#4DB6E5', '#9B6BFF', '#FF8FC8'];
      for (var i = 0; i < 70; i++) {
        var p = document.createElement('i');
        p.style.left = Math.random() * 100 + '%';
        p.style.background = cols[i % cols.length];
        p.style.animationDuration = 2 + Math.random() * 2 + 's';
        p.style.animationDelay = Math.random() * 0.6 + 's';
        p.style.setProperty('--sx', (Math.random() * 160 - 80) + 'px');
        p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        box.appendChild(p);
      }
      document.body.appendChild(box);
      setTimeout(function () { box.remove(); }, 4800);
    }
    endBox.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  }

  function tapTile(t) {
    say(t.dataset.word);
    if (selected === t) { select(null); setMsg('Pick a word and drop it on its picture!'); }
    else { select(t); setMsg('Now tap the picture for "' + t.dataset.word + '".'); }
  }

  /* ---------- drag ---------- */
  function attach(t) {
    var sx = 0, sy = 0, ssx = 0, ssy = 0, lx = 0, ly = 0, drag = false, id = null, raf = 0;
    function upd() {
      t.style.transform = 'translate(' + (lx - sx + (window.scrollX - ssx)) + 'px,' + (ly - sy + (window.scrollY - ssy)) + 'px) scale(1.06)';
      hover(cardAt(lx, ly));
    }
    function loop() {
      if (!drag) return;
      var v = ly < 80 ? -14 : (ly > window.innerHeight - 80 ? 14 : 0);
      if (v) { window.scrollBy(0, v); upd(); }
      raf = requestAnimationFrame(loop);
    }
    t.addEventListener('pointerdown', function (e) {
      if (t.classList.contains('placed') || (e.pointerType === 'mouse' && e.button !== 0)) return;
      id = e.pointerId; sx = lx = e.clientX; sy = ly = e.clientY; ssx = window.scrollX; ssy = window.scrollY; drag = false;
      try { t.setPointerCapture(id); } catch (err) {}
      ctx();
    });
    t.addEventListener('pointermove', function (e) {
      if (e.pointerId !== id) return;
      lx = e.clientX; ly = e.clientY;
      if (!drag) {
        if (Math.hypot(lx - sx, ly - sy) < 8) return;
        drag = true; t.classList.add('drag'); t.style.transition = 'none'; select(null); loop();
      }
      upd();
    });
    function finishDrag(e) {
      if (e.pointerId !== id) return;
      id = null; cancelAnimationFrame(raf);
      if (!drag) { tapTile(t); return; }
      drag = false; hover(null);
      var card = cardAt(lx, ly);
      if (e.type === 'pointercancel' || !card) snapBack(t); else attempt(t, card);
    }
    t.addEventListener('pointerup', finishDrag);
    t.addEventListener('pointercancel', finishDrag);
    t.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapTile(t); }
    });
  }

  cards.forEach(function (card) {
    function go() { if (selected) attempt(selected, card); }
    card.addEventListener('click', go);
    card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });

  document.getElementById('restart').addEventListener('click', build);
  document.getElementById('again').addEventListener('click', function () { build(); window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
  build();
})();
</script>
